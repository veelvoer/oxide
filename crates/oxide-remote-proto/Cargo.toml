[package]
name = "oxide-remote-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Protocol shared by oxide-remoted (PC) and the Oxide Remote phone app: discovery, pairing, encrypted session, messages."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
hmac = "0.12"
sha2 = "0.10"
getrandom = "0.2"
