[package]
name = "oxide-remote-app"
version = "0.7.2"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Oxide Remote: see and control your PCs from your phone"

# not part of the main workspace: it is built for Android with cargo-ndk (scripts/build-apk.sh)
[workspace]

[lib]
name = "oxide_remote"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "oxide-remote-desktop"
path = "src/desktop.rs"

[dependencies]
egui = "0.37"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
oxide-remote-proto = { path = "../crates/oxide-remote-proto" }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
jni = "0.21"
eframe = { version = "0.37", default-features = false, features = ["glow", "android-native-activity", "default_fonts"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

[profile.fast]
inherits = "release"
lto = false
codegen-units = 16
